# sveltia-cms-auth OAuth proxy Worker (deployed SEPARATELY from the Pages site).
#
# This Worker performs the GitHub OAuth code -> token exchange server-side so the
# self-hosted Sveltia CMS at /admin can log editors in (CMS-01). Cloudflare has no
# Netlify Git Gateway, so this exchange cannot happen client-side.
#
# Deploy from this directory:  wrangler deploy   (see README.md for the full flow)
#
# SECRETS (never committed; set once per Worker, encrypted at rest on Cloudflare):
#   wrangler secret put GITHUB_CLIENT_ID       # Client ID from the GitHub OAuth App
#   wrangler secret put GITHUB_CLIENT_SECRET   # Client Secret from the GitHub OAuth App
# Locally, put the same two keys in a gitignored .dev.vars (see .dev.vars.example).

name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"

# Non-secret access control (T-0205-02): only our live site may initiate auth.
# ALLOWED_DOMAINS is matched against Sveltia's site_id (the CMS host). Keeping it
# here (not as a secret) makes the allow-list auditable in git. Add the custom
# domain here too once zlobekstromiec.pl is live (comma-separated).
[vars]
ALLOWED_DOMAINS = "zlobek-gminny-stromiec.pages.dev"

[observability]
enabled = true
