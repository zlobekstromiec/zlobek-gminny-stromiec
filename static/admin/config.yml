# Sveltia CMS configuration for Publiczny Żłobek w Stromcu (CMS-03: all labels/hints Polish).
# Loaded by the self-hosted /admin/sveltia-cms.js bundle. No secrets live here
# (the OAuth client secret lives only on the sveltia-cms-auth Worker; see Plan 05).

backend:
  name: github
  repo: zlobekstromiec/zlobek-gminny-stromiec
  branch: main
  # Deployed sveltia-cms-auth Worker origin (account workers.dev subdomain:
  # devzlobekstromiec). MUST stay in sync with the connect-src entry in the
  # /admin/* CSP block in `_headers`.
  base_url: https://sveltia-cms-auth.devzlobekstromiec.workers.dev

# Branding: shown on the login page and in the browser tab (CMS-03).
app_title: 'Panel redakcyjny Żłobka w Stromcu'

# Direct publish to `main`, no editorial workflow (D-20).

# Global media = images only, stored under a Vite-processed path so
# @sveltejs/enhanced-img can optimize them at build (D-07, Pitfall 4).
media_folder: src/lib/assets/uploads
public_folder: /src/lib/assets/uploads
media_libraries:
  default:
    config:
      # Reject multi-MB originals and convert/cap on upload: the first layer of the
      # two-layer image defence (D-07, Pitfall 9). enhanced-img is the second layer.
      max_file_size: 5000000
      transformations:
        jpeg: { format: webp, quality: 82, width: 1600 }
        png: { format: webp, quality: 82, width: 1600 }

# Global slug rules (apply to every folder collection). `encoding: ascii`
# transliterates Polish letters to ASCII (ł→l, ż→z, ś→s) and `clean_accents`
# strips diacritics (ą→a, ę→e, ó→o), so a staff-typed title becomes a clean
# ASCII URL (D-06). Sveltia defaults (sanitize_replacement '-', lowercase, trim)
# are kept untouched.
slug:
  encoding: ascii
  clean_accents: true

singletons:
  - name: o_nas
    label: 'O nas'
    description: 'Tu edytujesz treść strony O nas: wprowadzenie, misję, wartości oraz opisy kadry i budynku. Zapisane zmiany pojawią się na stronie automatycznie po ok. 2 minutach.'
    file: src/lib/content/o-nas.json
    fields:
      - name: lead
        label: 'Wprowadzenie'
        widget: text
        hint: 'Krótki tekst wprowadzający na górze strony O nas.'
      - name: misja
        label: 'Misja'
        widget: markdown
        buttons: [bold, link]
        hint: 'Krótki opis misji żłobka. Dozwolone: pogrubienie i odnośniki.'
      - name: wartosci
        label: 'Wartości'
        widget: list
        hint: 'Dodaj wartości żłobka. Każda ma tytuł i krótki opis.'
        fields:
          - { name: tytul, label: 'Tytuł wartości', widget: string }
          - { name: opis, label: 'Opis', widget: text }
      - name: kadra_opis
        label: 'Kadra: opis'
        widget: markdown
        buttons: [bold, link]
        hint: 'Ciepły opis zespołu (kwalifikacje, podejście). Bez nazwisk i zdjęć.'
      - name: kadra_opiekunki
        label: 'Liczba opiekunek'
        widget: number
        value_type: int
        min: 0
        hint: 'Liczba opiekunek pokazywana na stronie O nas w sekcji Kadra.'
      - name: kadra_personel
        label: 'Personel pomocniczy (liczba)'
        widget: number
        value_type: int
        min: 0
        hint: 'Liczba osób personelu pomocniczego pokazywana obok liczby opiekunek.'
      - name: obiekt_opis
        label: 'O budynku'
        widget: markdown
        buttons: [bold, link]
        hint: 'Opis budynku, sali i placu zabaw.'
      - name: obiekt_zdjecia
        label: 'Zdjęcia (budynek, sala, plac zabaw)'
        widget: list
        hint: 'Zdjęcia bez osób. Zostaną zoptymalizowane automatycznie.'
        fields:
          - { name: plik, label: 'Zdjęcie', widget: image }
          - name: alt
            label: 'Opis alternatywny (alt)'
            widget: string
            hint: 'Krótki opis treści zdjęcia dla osób korzystających z czytników ekranu.'
      - name: placeholder
        label: 'Treść zastępcza (do potwierdzenia)'
        widget: boolean
        default: true
        hint: 'Zaznacz, dopóki treść nie została potwierdzona.'

  - name: day_plan
    label: 'Plan dnia'
    description: 'Godziny i zajęcia widoczne na stronie głównej oraz na stronie O nas w sekcji Plan dnia. Zapisane zmiany pojawią się na stronie po ok. 2 minutach.'
    file: src/lib/content/day-plan.json
    fields:
      # JSON keys stay `time` / `what` so the file round-trips with Plan 01 (D-03/D-06);
      # only the visible labels are Polish.
      - name: rows
        label: 'Godziny i zajęcia'
        widget: list
        hint: 'Kolejne punkty planu dnia. Każdy wiersz: godziny i opis.'
        fields:
          - name: time
            label: 'Godziny'
            widget: string
            hint: 'Np. 7:00–8:30.'
          - name: what
            label: 'Opis'
            widget: string
            hint: 'Krótki opis zajęć, np. Śniadanie.'
      - name: placeholder
        label: 'Treść zastępcza (do potwierdzenia)'
        widget: boolean
        default: true
        hint: 'Zaznacz, dopóki treść nie została potwierdzona.'

collections:
  - name: dokumenty
    label: 'Dokumenty'
    label_singular: 'Dokument'
    description: 'Dokumenty do pobrania na stronie Dokumenty (dwa dokumenty rekrutacyjne widać też na stronie głównej). Nazwij dokument po polsku, wybierz kategorię i dodaj plik. Zmiany pojawią się na stronie po ok. 2 minutach.'
    # No entry thumbnails: PDF/DOC previews cannot render under the strict
    # /admin/* CSP (pdfjs comes from a blocked CDN), leaving inconsistent
    # empty boxes. The document name and category are the identity here.
    thumbnail: false
    folder: src/lib/content/dokumenty
    create: true
    extension: json
    # Per-collection media: documents are served verbatim from /static (D-16/D-17),
    # NOT Vite-processed like the O nas images above.
    media_folder: /static/dokumenty
    public_folder: /dokumenty
    fields:
      - name: nazwa
        label: 'Nazwa dokumentu'
        widget: string
        hint: 'Czytelna nazwa po polsku (nie nazwa pliku).'
      - name: kategoria
        label: 'Kategoria'
        widget: select
        hint: 'Rekrutacja oraz Statut i uchwały są widoczne na stronie. Kategoria RODO zostanie włączona w późniejszym etapie.'
        # Fixed dropdown so staff cannot typo new categories into existence (D-13/D-15).
        options:
          - { label: 'Rekrutacja', value: 'rekrutacja' }
          - { label: 'Statut i uchwały', value: 'statut' }
          - { label: 'RODO', value: 'rodo' }
      - name: plik
        label: 'Plik'
        widget: file
        hint: 'Prześlij plik PDF, DOC lub DOCX.'
      - name: wersja
        label: 'Wersja z dnia'
        widget: datetime
        date_format: 'DD.MM.YYYY'
        time_format: false
        hint: 'Data wersji dokumentu (DD.MM.RRRR).'
      - name: zrodlo_bip
        label: 'Źródło (BIP), opcjonalnie'
        widget: string
        required: false
        hint: 'Odnośnik do dokumentu w BIP (opcjonalnie).'
      - name: placeholder
        label: 'Treść zastępcza (do potwierdzenia)'
        widget: boolean
        default: true
        hint: 'Zaznacz, dopóki treść nie została potwierdzona.'

  - name: aktualnosci
    label: 'Aktualności'
    label_singular: 'Wpis'
    identifier_field: tytul
    description: 'Wpisy widoczne na stronie Aktualności, najnowsze na górze. Trzy najnowsze pokazują się też na stronie głównej. Zmiany pojawią się na stronie po ok. 2 minutach.'
    folder: src/lib/content/aktualnosci
    create: true
    extension: json
    # CRITICAL (Pitfall 3): this collection deliberately sets NO per-collection
    # media path override. Covers inherit the GLOBAL Vite-processed uploads path
    # (src/lib/assets/uploads) so @sveltejs/enhanced-img can optimize them at build,
    # unlike dokumenty, which overrides to /static/dokumenty because PDFs are served
    # verbatim.
    #
    # Slug prefixes the publication `data` field by direct substitution: `data`
    # is stored on disk as ISO (`YYYY-MM-DD`, see the `format` key below), so the
    # template inserts it verbatim and every day of the month yields a correct
    # `RRRR-MM-DD-tytul` prefix. This is the CR-01 fix: the previous `date`
    # transformation could not parse the `DD.MM.YYYY` storage and minted
    # wrong (days 1-12, MM/DD swap) or dateless (days 13-31) URLs. The build
    # reader still takes the slug from the committed filename, never re-derived
    # (D-07/D-08).
    slug: '{{fields.data}}-{{fields.tytul}}'
    fields:
      - name: tytul
        label: 'Tytuł'
        widget: string
        hint: 'Tytuł wpisu po polsku (widoczny na liście i na stronie wpisu).'
      - name: data
        label: 'Data publikacji'
        widget: datetime
        # `date_format` is the Polish picker DISPLAY (staff pick DD.MM.RRRR);
        # `format` is the on-disk STORAGE format — ISO so the slug substitutes it
        # verbatim (CR-01). In @sveltia/cms@0.189.0 an explicit `format` is the
        # save format while `date_format` stays the editor display.
        date_format: 'DD.MM.YYYY'
        format: 'YYYY-MM-DD'
        time_format: false
        hint: 'Data wpisu (DD.MM.RRRR). Wpisy sortowane od najnowszego.'
      - name: zajawka
        label: 'Zajawka'
        widget: text
        required: false
        hint: 'Krótkie streszczenie (2-3 zdania) pokazywane na kafelku listy. Jeśli puste, użyjemy początku treści.'
      - name: tresc
        label: 'Treść'
        widget: markdown
        buttons: [bold, link, bulleted-list, numbered-list]
        hint: 'Pełna treść wpisu. Dozwolone: pogrubienie, odnośniki oraz listy.'
      - name: obraz
        label: 'Zdjęcie (opcjonalnie)'
        widget: image
        required: false
        hint: 'Zdjęcie nagłówkowe. Bez identyfikowalnych dzieci bez zgody. Zostanie zoptymalizowane automatycznie.'
      - name: obraz_alt
        label: 'Opis alternatywny zdjęcia (alt)'
        widget: string
        required: false
        hint: 'Krótki opis zdjęcia dla osób korzystających z czytników ekranu.'
      - name: placeholder
        label: 'Treść zastępcza (do potwierdzenia)'
        widget: boolean
        default: true
        hint: 'Zaznacz, dopóki treść nie została potwierdzona.'
