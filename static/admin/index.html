<!doctype html>
<html lang="pl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Panel redakcyjny: Żłobek Gminny w Stromcu</title>
		<link
			rel="preload"
			href="/admin/fonts/material-symbols-outlined-latin-wght-normal.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
	</head>
	<body>
		<!--
			Self-hosted, pinned Sveltia bundle only (no CDN hot-link). Refresh via `npm run cms:sync`.
			Script/link ORDER IS LOAD-BEARING:
			1. locale-pl.js exposes the Polish UI strings (generated by cms:sync).
			2. preboot.js seeds prefs (light theme, Polish UI) + the locale cache BEFORE the CMS boots.
			3. sveltia-cms.js reads both at boot.
			4. admin.css sits in <body> AFTER the bundle so it follows the bundle's head-injected
			   styles in cascade order (fonts + warm light theme overrides).
		-->
		<script src="/admin/locale-pl.js"></script>
		<script src="/admin/preboot.js"></script>
		<script src="/admin/sveltia-cms.js"></script>
		<link rel="stylesheet" href="/admin/admin.css" />
	</body>
</html>
